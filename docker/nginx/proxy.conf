# Shared by every proxied location. SSE-safe: no buffering, HTTP/1.1 (DEPLOY-12). Body limit and upstream timeouts are
# set per location by the generator (a duplicate directive here would be a configuration error).
# The X-API-Source header set by the engines passes through untouched (API-05).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Host loses the port ($host); the Go CSRF same-origin check compares Origin against this header (D-21).
proxy_set_header X-Forwarded-Host $http_host;
proxy_buffering off;
proxy_cache off;
chunked_transfer_encoding on;
