worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Access log without credentials (SEC-01, T-02-94, T-02-119). DELETE /api/v1/system/tokens/<token> carries the credential in the
    # path, so the segment after that prefix is replaced by *** before the line is written. The match runs on $uri, the decoded and
    # normalised path, so an encoded, doubled-slash or dot-segment spelling of the same path is masked too, and case-insensitively. Only the path
    # is logged: no query string ($request, $request_uri and $args can carry a code or a ticket) and no Referer (it carries the
    # browser's page URL, query included). The Go and Python request loggers likewise log the route template and no query.
    map $uri $loggable_uri {
        default $uri;
        "~*^(?<credential_prefix>/api/v1/system/tokens/).*" "${credential_prefix}***";
        # a credential-shaped segment anywhere else, such as in a mistyped endpoint, is masked as well
        "~*^(?<before_token>.*/)ragflow-[A-Za-z0-9_-]{20,}(?<after_token>.*)$" "${before_token}ragflow-***${after_token}";
    }
    log_format devrag '$remote_addr - $remote_user [$time_local] "$request_method $loggable_uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout devrag;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 1024m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
