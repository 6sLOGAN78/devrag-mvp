[project]
name = "devrag"
version = "0.1.0"
description = "devRag RAG platform (Python engine)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "quart==0.23.1",
    "hypercorn==0.18.0",
    "quart-schema==0.25.0",
    "quart-cors==0.8.0",
    "pydantic>=2.13,<3",
    "peewee>=3.19,<4",
    "PyMySQL==1.2.3",
    "valkey==6.1.1",
    "minio==7.2.20",
    "elasticsearch>=8.19,<9",
    "PyYAML==6.0.3",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "litellm==1.103.2",
    "openai>=2.20,<3",
    "ollama==0.6.3",
    "xxhash==4.0.1",
    "tiktoken>=0.12,<1",
    "pycryptodome==3.24.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers -p no:anyio"
testpaths = ["test", "scripts/ci/tests"]
markers = [
    "unit: fast tests with no external services",
    "integration: tests that need running services (compose stack)",
    "e2e: end-to-end flows through the real pipeline",
    "serial: tests that must not run in parallel with others",
    "smoke: minimal post-deploy sanity checks",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 200
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "ASYNC", "S301", "S403", "S608", "S602", "S605", "S307", "S102", "S105", "S106", "FIX001", "FIX002"]

# S603/S607 fire on every list-form subprocess call with fixed arguments; the shell-based
# variants (S602, S605) stay enforced. S101 (assert) is the pytest idiom and is allowed in tests only.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["S101", "S105", "S106"]
"scripts/ci/tests/**" = ["S101", "S105", "S106"]
