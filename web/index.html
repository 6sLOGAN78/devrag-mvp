<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>devRag</title>
    <script>
      (function () {
        /* Mirrors shouldUseDark in src/utils/theme.ts (a unit test runs this script against it). Inline so the class is set before first paint. */
        var stored = null;
        try {
          stored = localStorage.getItem("devrag.theme");
        } catch (e) {}
        var system = false;
        try {
          system = typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        if (stored === "dark" || (stored !== "light" && system)) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
