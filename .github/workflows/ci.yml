# Mirrors `make ci` and `make test-unit` (Go, Node 22, web deps, read-only token). No secrets are used.
# First run on GitHub Actions passed on 2026-10-07 (see .planning/BLOCKERS.md, B-06, closed).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: uv sync --frozen
      - run: make ci
      - run: make test-unit
