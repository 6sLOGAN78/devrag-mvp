# Dev memory caps for a 15 GB shared host (D-29, R-56, R-72). Documented values stay in the base file.
services:
  es01:
    mem_limit: 2g
    environment:
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      cluster.routing.allocation.disk.watermark.low: 1gb
      cluster.routing.allocation.disk.watermark.high: 750mb
      cluster.routing.allocation.disk.watermark.flood_stage: 500mb
  mysql:
    mem_limit: 640m
    command:
      - --max_connections=200
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
  redis:
    mem_limit: 160m
  minio:
    mem_limit: 256m
  # The app services are profile-gated; image is repeated so this file stays valid on its own
  # (infra-only runs include this file without the cpu profile).
  init:
    profiles: [cpu]
    image: ${RAGFLOW_IMAGE:-devrag-app:local}
    mem_limit: 256m
  # Per-IP rate limits only (D-29, R-94). Every e2e, live and clean-room request reaches Go from one address
  # through Nginx, so the production per-IP windows would return 429. Per-email limits stay at production
  # values; tests that need them use dedicated emails. Never copy these into docker-compose.yml.
  app:
    profiles: [cpu]
    image: ${RAGFLOW_IMAGE:-devrag-app:local}
    mem_limit: 768m
    environment:
      RATE_LIMIT_REGISTER_PER_IP: ${DEV_RATE_LIMIT_PER_IP_MAX:-100000}
      RATE_LIMIT_LOGIN_PER_IP: ${DEV_RATE_LIMIT_PER_IP_MAX:-100000}
      RATE_LIMIT_OTP_PER_IP_PER_HOUR: ${DEV_RATE_LIMIT_PER_IP_MAX:-100000}
